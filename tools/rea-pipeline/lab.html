<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>原版分析工作台</title><link rel="stylesheet" href="/lab.css"></head>
<body><header><h1>原版分析工作台</h1><p>原始资源预览 · 静态索引 · 模拟器采集记录</p></header>
<main><aside>
<label>逻辑检索<input id="query" value="UISelectEquip"></label><button id="search">查询</button>
<label>窗口资源<select id="windows"></select></label><button id="open">打开原始窗口</button>
<button id="back">关闭顶层窗口</button>
<label>显式绑定（JSON；不会执行代码）<textarea id="bindings" rows="8">{}</textarea></label>
<button id="apply">应用绑定</button>
<label>数据状态（JSON）<textarea id="state" rows="5">{}</textarea></label><button id="update">更新数据</button>
<p id="status" role="status"></p><details><summary>覆盖情况</summary><pre id="coverage"></pre></details>
<details><summary>采集记录</summary><pre id="runs"></pre></details>
</aside><section id="preview" aria-label="原始窗口预览"></section><section class="evidence">
<h2>关系与证据</h2><pre id="results"></pre><h2>窗口状态 / 未解析项</h2><pre id="snapshot"></pre>
</section></main><script src="/unity-rect.js"></script><script src="/source-window.js"></script><script src="/lab.js"></script></body></html>
